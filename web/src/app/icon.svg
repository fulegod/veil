<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Rounded square — Arkiv brandmark shape, Veil green -->
  <rect width="64" height="64" rx="10" ry="10" fill="#00e676"/>

  <!-- Left bracket [ — drawn as geometric paths, ultra bold -->
  <path
    d="M 12 16 L 20 16 L 20 20 L 16 20 L 16 44 L 20 44 L 20 48 L 12 48 Z"
    fill="#ffffff"
  />

  <!-- V — geometric, ultra bold, mirrors Arkiv's A weight -->
  <path
    d="M 23 16 L 28 16 L 32 38 L 36 16 L 41 16 L 35 48 L 29 48 Z"
    fill="#ffffff"
  />

  <!-- Right bracket ] — mirror of left -->
  <path
    d="M 52 16 L 44 16 L 44 20 L 48 20 L 48 44 L 44 44 L 44 48 L 52 48 Z"
    fill="#ffffff"
  />
</svg>
